<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>땡겨요 앱 열기</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#102d56;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,520px);background:#fff;border:1px solid #dce4ef;border-radius:28px;padding:28px;box-shadow:0 18px 48px rgba(15,45,86,.14)}
    img{width:72px;height:72px;border-radius:18px}h1{font-size:28px;margin:18px 0 10px}p{font-size:17px;line-height:1.65;color:#64748b;margin:0 0 24px}
    .actions{display:grid;gap:12px}.actions button,.actions a{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:18px;font-size:17px;font-weight:800;text-decoration:none;padding:12px 18px;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #retry{border:0;background:#ff5a24;color:#fff;cursor:pointer}.store{background:#eef3f9;color:#173a66}.back{border:1px solid #d9e1ec;background:#fff;color:#173a66}
    #status{min-height:22px;margin:14px 0 0;color:#365b7f;font-size:14px;font-weight:750}
    small{display:block;margin-top:20px;color:#8290a3;line-height:1.5}
  </style>
</head>
<body>
  <main>
    <img src="assets/ddangyo-v7.png" alt="땡겨요">
    <h1>땡겨요 앱을 열지 못했습니다</h1>
    <p>앱이 설치되어 있다면 다시 열기를 눌러 주세요. Play 스토어는 고객님이 직접 선택할 때만 열립니다.</p>
    <div class="actions">
      <a id="retry" href="#">땡겨요 앱 다시 열기</a>
      <a class="store" href="https://play.google.com/store/apps/details?id=com.shinhan.o2o">Play 스토어에서 확인</a>
      <button class="back" id="back" type="button">대동여수음식지도로 돌아가기</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <small>앱이 이미 설치되어 있는데도 열리지 않으면 카카오톡 오른쪽 위 메뉴에서 다른 브라우저로 열어 보세요.</small>
  </main>
  <script>
    const retryKey='daedongDdangyoRetryIntentV1';
    const playStore='https://play.google.com/store/apps/details?id=com.shinhan.o2o';
    const params=new URLSearchParams(location.search);
    const origin=String(params.get('origin')||'').trim();
    let officialRoute='';
    try{
      const candidate=new URL(params.get('route')||'');
      if(candidate.hostname==='fdofd.ddangyo.com'&&/\/gateway1\.html$/i.test(candidate.pathname))officialRoute=candidate.href;
    }catch{}
    function validOrigin(value){return value.includes('menuUrl=')&&value.includes('patsto_no=')&&!/[#;]/.test(value)&&/^[-A-Za-z0-9%._~=&/?+]+$/.test(value)}
    function retryIntent(value){
      const fallback=encodeURIComponent(location.href);
      return `intent://o2o/deeplink/${value}#Intent;scheme=ddangyo;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.shinhan.o2o;S.browser_fallback_url=${fallback};end;`;
    }
    let savedIntent='';
    try{savedIntent=sessionStorage.getItem(retryKey)||localStorage.getItem(retryKey)||''}catch{}
    const retryHref=validOrigin(origin)?retryIntent(origin):(savedIntent||officialRoute||playStore);
    const retry=document.querySelector('#retry');
    retry.href=retryHref;
    if(retryHref===playStore)retry.textContent='Play 스토어에서 땡겨요 확인';
    retry.addEventListener('click',()=>{document.querySelector('#status').textContent='땡겨요 앱을 다시 여는 중입니다.'});
    document.querySelector('#back').addEventListener('click',()=>{
      if(history.length>1)history.back();else location.replace('./');
    });
  </script>
</body>
</html>
