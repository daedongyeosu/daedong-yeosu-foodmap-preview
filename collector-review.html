<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#071f3d">
  <title>요기요 수집 검수 | 대동여수음식지도 Preview</title>
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="collector-review.css?v=3">
</head>
<body>
  <header class="review-header">
    <a href="/" aria-label="대동여수음식지도 Preview 홈으로">← 홈</a>
    <div><small>대동여수음식지도</small><strong>요기요 수집 검수</strong></div>
    <button id="refreshBtn" type="button">새로고침</button>
  </header>
  <main>
    <section class="review-intro">
      <span class="preview-badge">PREVIEW 전용 · 고객 미공개</span>
      <h1>자동수집된 여수 가게를 확인합니다</h1>
      <p>기존 가게 자료는 덮어쓰지 않고 부족한 항목만 보충 후보로 표시합니다. 신규 가게도 승인 전에는 고객 목록에 들어가지 않습니다.</p>
    </section>
    <section id="summary" class="summary-grid" aria-label="수집 현황">
      <article><b id="collectedCount">-</b><span>전체 수집본</span></article>
      <article><b id="totalCount">-</b><span>중복 제외 가게</span></article>
      <article><b id="duplicateCount">-</b><span>반복 수집 제외</span></article>
      <article><b id="existingCount">-</b><span>기존 가게 보충</span></article>
      <article><b id="newStoreCount">-</b><span>신규 가게 후보</span></article>
      <article><b id="reviewCount">-</b><span>확인 필요</span></article>
      <article><b id="menuCount">-</b><span>고유 가게 메뉴</span></article>
      <article><b id="photoCount">-</b><span>사진 화면 증거(정제 전)</span></article>
      <article><b id="linkCount">-</b><span>요기요 링크 가게</span></article>
    </section>
    <section class="review-tools">
      <label><span class="sr-only">가게명 검색</span><input id="searchInput" type="search" placeholder="가게명 또는 주소 검색"></label>
      <div id="filterTabs" class="filter-tabs" role="tablist" aria-label="후보 종류">
        <button type="button" data-filter="all" class="active">전체</button>
        <button type="button" data-filter="existing">기존가게 보충</button>
        <button type="button" data-filter="newStore">신규가게</button>
        <button type="button" data-filter="review">확인필요</button>
      </div>
    </section>
    <p id="statusMessage" class="status-message" role="status">수집 자료를 불러오는 중입니다.</p>
    <section id="candidateList" class="candidate-list" aria-live="polite"></section>
  </main>
  <dialog id="detailDialog" class="detail-dialog">
    <div class="dialog-head"><strong id="detailTitle">가게 후보</strong><button id="detailClose" type="button" aria-label="닫기">×</button></div>
    <div id="detailBody"></div>
  </dialog>
  <script src="collector-review.js?v=4-photo-evidence-summary" defer></script>
</body>
</html>
