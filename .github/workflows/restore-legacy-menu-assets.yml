name: Restore Legacy Menu Assets

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/restore-legacy-menu-assets.yml

permissions:
  contents: write

concurrency:
  group: restore-legacy-menu-assets
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: work/restore-legacy-menu-assets-v2
          fetch-depth: 1

      - name: Check out original menu assets
        uses: actions/checkout@v4
        with:
          repository: daedongyeosu/daedong-yeosu-foodmap
          ref: main
          path: _source
          fetch-depth: 1

      - name: Restore Alien Pizza, Domino and Surasanggung menus
        run: |
          mkdir -p store-menu-content
          cp -a _source/store-menu-content/a089d1d54720b48e store-menu-content/
          cp -a _source/store-menu-content/domino store-menu-content/
          cp -a _source/store-menu-content/surasanggung store-menu-content/

      - name: Validate restored menu assets
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const checks = [
            ['store-menu-content/a089d1d54720b48e/menu.json', 53],
            ['store-menu-content/domino/menu.json', 70],
            ['store-menu-content/surasanggung/menu.json', 46]
          ];
          for (const [file, expected] of checks) {
            const menu = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!Array.isArray(menu.items) || menu.items.length !== expected) {
              throw new Error(`${file}: ${menu.items?.length} != ${expected}`);
            }
          }
          for (const image of [
            'store-menu-content/a089d1d54720b48e/main.jpg',
            'store-menu-content/domino/main.jpg',
            'store-menu-content/surasanggung/main.jpg'
          ]) {
            if (!fs.existsSync(image) || fs.statSync(image).size < 1000) throw new Error(`missing image ${image}`);
          }
          console.log(JSON.stringify({alien:53, domino:70, surasanggung:46}, null, 2));
          NODE

      - name: Commit restored assets
        run: |
          rm -rf _source
          rm -f .github/workflows/restore-legacy-menu-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "기존 외계인피자 도미노 수라상궁 음식보기 자산 복구"
          git push origin HEAD:work/restore-legacy-menu-assets-v2
