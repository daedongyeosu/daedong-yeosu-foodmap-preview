name: Install Validated Complete Ddangyo Package

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ddangyo-complete-fingerprint-probe.yml
      - .install-ddangyo-complete-package-trigger
      - scripts/**
      - data/ddangyo-manual-existing-overrides.json

permissions:
  contents: write

concurrency:
  group: install-complete-ddangyo-pr
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out preview work branch with full history
        uses: actions/checkout@v4
        with:
          ref: work/ddangyo-hours-benefits-complete
          fetch-depth: 0
          path: preview

      - name: Check out production history
        uses: actions/checkout@v4
        with:
          repository: daedongyeosu/daedong-yeosu-foodmap
          ref: main
          fetch-depth: 0
          path: production

      - name: Rebuild and validate complete package
        run: |
          node preview/scripts/collect-all-historical-ddangyo-links.mjs preview production
          cd preview
          node scripts/ddangyo-complete-fingerprint-probe.mjs
          node scripts/extract-all-historical-ddangyo.mjs ../ddangyo-historical-links-output/all-historical-ddangyo-links.json
          node scripts/reclassify-all-ddangyo-stores.mjs ddangyo-all-extraction-output/all-stores-normalized.json
          node scripts/finalize-ddangyo-classification.mjs ddangyo-reclassification-output/reclassified-stores.json
          node scripts/resolve-final-ddangyo-classification.mjs ddangyo-final-classification-output/final-stores.json
          node scripts/build-ddangyo-service-info.mjs ddangyo-final-ready-output/final-stores.json
          node scripts/build-ddangyo-enrichment.mjs ddangyo-final-ready-output/final-stores.json
          node scripts/build-ddangyo-menus.mjs ddangyo-final-ready-output/final-stores.json
          node scripts/validate-ddangyo-package.mjs

      - name: Install validated additive files
        working-directory: preview
        run: |
          cp ddangyo-package-output/store-service-info.json store-service-info.json
          cp ddangyo-package-output/data/ddangyo-store-enrichment.json data/ddangyo-store-enrichment.json
          cp ddangyo-package-output/data/ddangyo-coupon-details.json data/ddangyo-coupon-details.json
          rsync -a ddangyo-package-output/store-menu-content/ store-menu-content/

      - name: Correct stale Ddangyo routes and bump cache versions
        working-directory: preview
        run: node scripts/patch-installed-ddangyo-runtime.mjs

      - name: Validate installed files and protected data
        working-directory: preview
        run: |
          node --check ddangyo-preview-runtime.js
          node --check store-service-info.js
          cmp ddangyo-package-output/store-service-info.json store-service-info.json
          cmp ddangyo-package-output/data/ddangyo-store-enrichment.json data/ddangyo-store-enrichment.json
          cmp ddangyo-package-output/data/ddangyo-coupon-details.json data/ddangyo-coupon-details.json
          grep -q "store-service-info.json?v=store-service-7" store-service-info.js
          grep -q "store-service-info.css?v=store-service-7" index.html
          grep -q "store-service-info.js?v=store-service-7" index.html
          grep -q "ddangyo-menu-map.js?v=20260802-4" index.html
          grep -q "ddangyo-preview-runtime.js?v=20260802-4" index.html
          grep -q "correctedDdangyoRoutes" ddangyo-preview-runtime.js
          test -z "$(git diff --name-only -- data/stores.json)"
          node - <<'NODE'
          const fs = require('fs');
          const service = JSON.parse(fs.readFileSync('store-service-info.json', 'utf8'));
          const enrichment = JSON.parse(fs.readFileSync('data/ddangyo-store-enrichment.json', 'utf8'));
          const summary = JSON.parse(fs.readFileSync('ddangyo-package-output/package-validation-summary.json', 'utf8'));
          if (summary.classification.existing !== 444 || summary.classification.newStores !== 0) throw new Error('identity validation failed');
          if (summary.service.hoursCreated + summary.service.hoursSupplemented !== 444) throw new Error('hours validation failed');
          if (summary.menus.menuFiles !== 444) throw new Error('menu validation failed');
          if (enrichment.stores.length !== 444) throw new Error(`enrichment ${enrichment.stores.length}`);
          if (!service.stores.d14f1e6669383a88) throw new Error('MegaMGC service record missing');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Remove temporary extraction machinery
        working-directory: preview
        run: |
          rm -f .ddangyo-complete-fingerprint-trigger .install-ddangyo-complete-package-trigger
          rm -f .github/workflows/ddangyo-complete-fingerprint-probe.yml
          rm -f .github/workflows/install-ddangyo-complete-package.yml
          rm -f data/ddangyo-manual-existing-overrides.json
          rm -f scripts/ddangyo-complete-fingerprint-probe.mjs
          rm -f scripts/collect-all-historical-ddangyo-links.mjs
          rm -f scripts/extract-all-historical-ddangyo.mjs
          rm -f scripts/reclassify-all-ddangyo-stores.mjs
          rm -f scripts/finalize-ddangyo-classification.mjs
          rm -f scripts/resolve-final-ddangyo-classification.mjs
          rm -f scripts/ddangyo-package-utils.mjs
          rm -f scripts/build-ddangyo-service-info.mjs
          rm -f scripts/build-ddangyo-enrichment.mjs
          rm -f scripts/build-ddangyo-menus.mjs
          rm -f scripts/validate-ddangyo-package.mjs
          rm -f scripts/patch-installed-ddangyo-runtime.mjs
          rm -rf ddangyo-complete-fingerprint-probe-output
          rm -rf ddangyo-all-extraction-output
          rm -rf ddangyo-reclassification-output
          rm -rf ddangyo-final-classification-output
          rm -rf ddangyo-final-ready-output
          rm -rf ddangyo-package-output

      - name: Commit validated package to preview work branch
        working-directory: preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "과거 전체 땡겨요 444곳 지문등록식 누락정보 보완"
          git pull --rebase origin work/ddangyo-hours-benefits-complete
          git push origin HEAD:work/ddangyo-hours-benefits-complete
