name: Ddangyo Complete Fingerprint Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/ddangyo-complete-fingerprint-probe.mjs
      - scripts/collect-all-historical-ddangyo-links.mjs
      - scripts/extract-all-historical-ddangyo.mjs
      - scripts/reclassify-all-ddangyo-stores.mjs
      - .github/workflows/ddangyo-complete-fingerprint-probe.yml
      - .ddangyo-complete-fingerprint-trigger

permissions:
  contents: read

concurrency:
  group: ddangyo-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out preview full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: preview

      - name: Check out production full history
        uses: actions/checkout@v4
        with:
          repository: daedongyeosu/daedong-yeosu-foodmap
          ref: main
          fetch-depth: 0
          path: production

      - name: Collect every historical Ddangyo link from both repositories
        run: node preview/scripts/collect-all-historical-ddangyo-links.mjs preview production

      - name: Probe exact hours and coupon request formats
        working-directory: preview
        run: node scripts/ddangyo-complete-fingerprint-probe.mjs

      - name: Extract every historical Ddangyo store
        working-directory: preview
        run: node scripts/extract-all-historical-ddangyo.mjs ../ddangyo-historical-links-output/all-historical-ddangyo-links.json

      - name: Reclassify existing, new and shop-in-shop stores conservatively
        working-directory: preview
        run: node scripts/reclassify-all-ddangyo-stores.mjs ddangyo-all-extraction-output/all-stores-normalized.json

      - name: Upload historical link inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-historical-ddangyo-links
          path: ddangyo-historical-links-output
          if-no-files-found: error
          retention-days: 2

      - name: Upload field probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddangyo-complete-fingerprint-probe
          path: preview/ddangyo-complete-fingerprint-probe-output
          if-no-files-found: error
          retention-days: 2

      - name: Upload complete extraction output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddangyo-all-historical-extraction
          path: preview/ddangyo-all-extraction-output
          if-no-files-found: error
          retention-days: 2

      - name: Upload conservative reclassification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddangyo-reclassification-report
          path: preview/ddangyo-reclassification-output
          if-no-files-found: error
          retention-days: 2
