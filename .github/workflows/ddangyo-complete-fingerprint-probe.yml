name: Ddangyo Complete Fingerprint Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/ddangyo-complete-fingerprint-probe.mjs
      - .github/workflows/ddangyo-complete-fingerprint-probe.yml
      - .ddangyo-complete-fingerprint-trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Probe Ddangyo hours and benefits fields
        run: node scripts/ddangyo-complete-fingerprint-probe.mjs

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddangyo-complete-fingerprint-probe
          path: ddangyo-complete-fingerprint-probe-output
          if-no-files-found: error
          retention-days: 1
