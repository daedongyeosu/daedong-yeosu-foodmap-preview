name: Finalize App Scoped Benefit Copy

on:
  push:
    branches:
      - work/app-scoped-benefits-preview
    paths:
      - .finalize-app-scoped-benefit-copy-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/app-scoped-benefits-preview
          fetch-depth: 1

      - name: Apply final copy fixes
        run: node scripts/finalize-app-scoped-benefit-copy.mjs

      - name: Validate final wording
        run: |
          node --check store-service-info.js
          grep -q '주문앱별 혜택 한눈에' store-service-info.js
          grep -q '주문앱별 혜택 미확인' store-service-info.js
          grep -q '표시된 주문앱 기준' store-service-info.js
          ! grep -q '>영업·혜택 한눈에<' store-service-info.js
          ! grep -q '>결제·혜택 미확인<' store-service-info.js

      - name: Commit final copy
        run: |
          rm -f .finalize-app-scoped-benefit-copy-trigger
          rm -f .github/workflows/finalize-app-scoped-benefit-copy.yml
          rm -f scripts/finalize-app-scoped-benefit-copy.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "주문앱별 혜택 리스트 문구 최종 정리"
          git pull --rebase origin work/app-scoped-benefits-preview
          git push origin HEAD:work/app-scoped-benefits-preview
