name: Rebuild Ddangyo 73 Preview

on:
  push:
    branches:
      - work/ddangyo-73-preview-v2
    paths:
      - .github/workflows/install-ddangyo-73-preview.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/install-ddangyo-73-preview.yml

permissions:
  contents: write

concurrency:
  group: rebuild-ddangyo-73-preview-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: work/ddangyo-73-preview-v2
          fetch-depth: 1

      - name: Check out verified Ddangyo extraction branch
        uses: actions/checkout@v4
        with:
          repository: daedongyeosu/daedong-yeosu-foodmap
          ref: work/ddangyo-fingerprint-batch-01
          path: _source
          fetch-depth: 1

      - name: Extract and rebuild unique menus
        working-directory: _source
        run: |
          node scripts/ddangyo-shop-data-probe.mjs
          node scripts/ddangyo-rematch-report.mjs
          node scripts/ddangyo-finalize-match-overrides.mjs
          node scripts/ddangyo-enrich-phones.mjs
          node scripts/build-ddangyo-integration.mjs
          node scripts/package-ddangyo-preview-assets.mjs

      - name: Install generated preview files
        run: |
          cp -a _source/ddangyo-integration-output/. .
          node install-ddangyo-preview.mjs

      - name: Validate unique preview package
        run: |
          node --check ddangyo-preview-runtime.js
          node --check store-menu-preview.js
          node --check store-menu-content/ddangyo-menu-map.js
          node - <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('integration-summary.json', 'utf8'));
          const enrichment = JSON.parse(fs.readFileSync('data/ddangyo-store-enrichment.json', 'utf8'));
          if (summary.stores !== 73) throw new Error(`stores ${summary.stores}`);
          if (summary.existingStores !== 46) throw new Error(`existing ${summary.existingStores}`);
          if (summary.newStores !== 27) throw new Error(`new ${summary.newStores}`);
          if (summary.rawMenuItems !== 4585) throw new Error(`raw menus ${summary.rawMenuItems}`);
          if (summary.duplicateMenuItemsRemoved !== 315) throw new Error(`removed ${summary.duplicateMenuItemsRemoved}`);
          if (summary.totalMenuItems !== 4270) throw new Error(`unique menus ${summary.totalMenuItems}`);
          if (summary.rawMenuImages !== 3294) throw new Error(`raw images ${summary.rawMenuImages}`);
          if (summary.totalMenuImages !== 2979) throw new Error(`unique images ${summary.totalMenuImages}`);
          if (summary.pricesIncluded !== false) throw new Error('prices must remain hidden');
          if (summary.phoneValuesIncluded !== 73) throw new Error(`phones ${summary.phoneValuesIncluded}`);
          if (enrichment.stores.some(row => row.phone && row.phoneSource !== 'ddangyo')) throw new Error('unapproved phone source');
          if (!fs.readFileSync('index.html', 'utf8').includes('ddangyo-preview-runtime.js')) throw new Error('runtime script missing');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Commit rebuilt preview installation
        run: |
          rm -rf _source
          rm -rf data/ddangyo-preview
          rm -f install-ddangyo-preview.mjs existing-stores.json new-stores.json
          rm -f .github/workflows/install-ddangyo-73-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "땡겨요 메뉴 중복 제거 후 preview 재생성"
          git push origin HEAD:work/ddangyo-73-preview-v2
