name: Bump App Scoped Benefit Cache

on:
  push:
    branches:
      - work/app-scoped-benefits-preview
    paths:
      - .bump-app-scoped-benefit-cache-trigger

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/app-scoped-benefits-preview
          fetch-depth: 1

      - name: Bump cache keys
        run: node scripts/bump-app-scoped-benefit-cache.mjs

      - name: Validate cache keys
        run: |
          node --check store-service-info.js
          grep -q "store-service-info.json?v=store-service-6" store-service-info.js
          grep -q "store-service-info.css?v=store-service-6" index.html
          grep -q "store-service-info.js?v=store-service-6" index.html

      - name: Commit cache bump
        run: |
          rm -f .bump-app-scoped-benefit-cache-trigger
          rm -f .github/workflows/bump-app-scoped-benefit-cache.yml
          rm -f scripts/bump-app-scoped-benefit-cache.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "주문앱별 혜택 화면 캐시 버전 갱신"
          git pull --rebase origin work/app-scoped-benefits-preview
          git push origin HEAD:work/app-scoped-benefits-preview
