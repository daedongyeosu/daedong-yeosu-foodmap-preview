name: Sync Production Baseline Into Preview V2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sync-production-baseline-v2.yml
      - .github/workflows/sync-production-baseline.yml
      - .sync-production-baseline-trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sync-production-baseline-preview
          path: preview
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: daedongyeosu/daedong-yeosu-foodmap
          ref: main
          path: production
          fetch-depth: 1

      - name: Sync production web baseline and restore preview overlay
        run: |
          mkdir -p /tmp/overlay/data
          cp preview/CNAME /tmp/overlay/CNAME
          cp preview/data/ddangyo-store-enrichment.json /tmp/overlay/data/ddangyo-store-enrichment.json
          cp preview/ddangyo-preview-runtime.js /tmp/overlay/ddangyo-preview-runtime.js
          cp preview/integration-summary.json /tmp/overlay/integration-summary.json
          cp -a preview/store-menu-content /tmp/overlay/store-menu-content

          rsync -a --checksum --delete \
            --exclude='.git/' --exclude='.github/' --exclude='CNAME' --exclude='android/' \
            --exclude='store-menu-content/' --exclude='data/ddangyo-store-enrichment.json' \
            --exclude='ddangyo-preview-runtime.js' --exclude='integration-summary.json' \
            production/ preview/

          cp /tmp/overlay/CNAME preview/CNAME
          cp /tmp/overlay/data/ddangyo-store-enrichment.json preview/data/ddangyo-store-enrichment.json
          cp /tmp/overlay/ddangyo-preview-runtime.js preview/ddangyo-preview-runtime.js
          cp /tmp/overlay/integration-summary.json preview/integration-summary.json
          rm -rf preview/store-menu-content
          cp -a /tmp/overlay/store-menu-content preview/store-menu-content

      - name: Reattach preview-only scripts
        working-directory: preview
        run: |
          node - <<'NODE'
          const fs = require('fs');
          let html = fs.readFileSync('index.html', 'utf8')
            .replace(/\n?\s*<script[^>]+store-menu-content\/ddangyo-menu-map\.js[^>]*><\/script>/g, '')
            .replace(/\n?\s*<script[^>]+ddangyo-preview-runtime\.js[^>]*><\/script>/g, '');
          const extra = [
            '  <script src="store-menu-content/ddangyo-menu-map.js?v=20260802-3" defer></script>',
            '  <script src="ddangyo-preview-runtime.js?v=20260802-3" defer></script>'
          ].join('\n');
          const marker = /\s*<script[^>]+store-menu-preview\.js[^>]*><\/script>/;
          html = marker.test(html) ? html.replace(marker, `\n${extra}$&`) : html.replace('</body>', `${extra}\n</body>`);
          fs.writeFileSync('index.html', html);
          NODE

      - name: Validate production parity and preview additions
        run: |
          set -e
          for file in app.js final-experience.js styles.css store-menu-preview.js store-menu-preview.css store-service-info.js store-service-info.json data/stores.json; do
            cmp --silent "preview/$file" "production/$file" || { echo "MISMATCH $file"; exit 1; }
          done
          grep -q 'preview.daedongmap.com' preview/CNAME
          grep -q 'store-service-info.js' preview/index.html
          grep -q 'ddangyo-menu-map.js?v=20260802-3' preview/index.html
          grep -q 'ddangyo-preview-runtime.js?v=20260802-3' preview/index.html
          grep -q '여수섬섬페이' preview/store-service-info.json
          grep -q '고유가 피해지원금' preview/store-service-info.json
          grep -q '온누리상품권' preview/store-service-info.json
          grep -q '무료배달' preview/store-service-info.json
          node --check preview/app.js
          node --check preview/final-experience.js
          node --check preview/store-menu-preview.js
          node --check preview/store-service-info.js
          node --check preview/ddangyo-preview-runtime.js
          node - <<'NODE'
          const fs = require('fs');
          const e = JSON.parse(fs.readFileSync('preview/data/ddangyo-store-enrichment.json','utf8'));
          const s = JSON.parse(fs.readFileSync('preview/integration-summary.json','utf8'));
          const n = e.stores.filter(x => x.isNew === true);
          if (e.stores.length !== 73 || n.length !== 27 || s.totalMenuItems !== 4270) throw new Error('preview overlay count changed');
          if (n.some(x => x.chakUrl !== 'https://bit.ly/chak-yeosu')) throw new Error('CHAK missing');
          if (n.filter(x => x.naverStatus === 'verified' && x.naverMap).length !== 14) throw new Error('Naver count changed');
          console.log(JSON.stringify({productionParity:true, ddangyoStores:73, newStores:27, naverVerified:14}));
          NODE

      - name: Commit synchronized preview
        working-directory: preview
        run: |
          rm -f .sync-production-baseline-trigger
          rm -f .github/workflows/sync-production-baseline.yml .github/workflows/sync-production-baseline-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "운영본 최신 화면과 기능을 preview 기준으로 동기화"
          git pull --rebase origin work/sync-production-baseline-preview
          git push origin HEAD:work/sync-production-baseline-preview
