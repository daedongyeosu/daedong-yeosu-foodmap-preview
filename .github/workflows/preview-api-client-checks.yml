name: Verify preview API client

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview-api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check data-api.js
          node --check data-api-runtime.js
          node --check app.js
          node --check final-experience.js
          node --check rc2-fixes.js
          node --check rc6-fixes.js
          node --check rc7-address-map.js
          node --check store-service-info.js
          node --check store-menu-preview.js
          node --check mukkebi-summer-event.js
      - name: Verify API client and existing static contracts
        run: |
          node scripts/audit-public-repository.mjs
          node cloudflare-data-api-regression-test.mjs
          node scripts/validate-static.mjs
          node scripts/validate-data.mjs
      - name: Verify preserved preview experience
        run: |
          node analytics-owner-exclusion-regression-test.mjs
          node app-list-direct-order-regression-test.mjs
          node app-browser-category-label-regression-test.mjs
          node category-heading-layout-regression-test.mjs
          node coarse-region-analytics-regression-test.mjs
          node community-intro-regression-test.mjs
          node external-app-text-regression-test.mjs
          node global-business-status-ranking-regression-test.mjs
          node hero-carousel-forward-only-regression-test.mjs
          node hero-store-direct-popup-regression-test.mjs
          node home-address-ux-regression-test.mjs
          node saved-address-flow-regression-test.mjs
          node simple-app-return-regression-test.mjs
          node direct-app-return-no-home-regression-test.mjs
          node ddangyo-retry-touch-regression-test.mjs
          node inapp-location-recovery-regression-test.mjs
          node kakao-order-link-regression-test.mjs
          node location-ranking-unification-regression-test.mjs
          node mobile-initialization-unblock-regression-test.mjs
          node nearby-rail-status-ranking-regression-test.mjs
          node outside-yeosu-full-list-regression-test.mjs
          node photo-viewer-removal-regression-test.mjs
          node rain-mode-admin-integration-regression-test.mjs
          node release-readiness-regression-test.mjs
          node store-popup-info-menu-order-regression-test.mjs
          node store-popup-native-order-regression-test.mjs
          node store-service-open-count-loading-regression-test.mjs
          node store-service-sensitive-counts-regression-test.mjs
          node turtle-ship-hero-regression-test.mjs
          node unified-search-menu-order-regression-test.mjs
