name: Verify preview API client

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview-api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check data-api.js
          node --check data-api-runtime.js
          node --check app.js
          node --check final-experience.js
          node --check rc2-fixes.js
          node --check rc3-fixes.js
          node --check rc4-fixes.js
          node --check rc5-fixes.js
          node --check rc6-fixes.js
          node --check rc7-address-map.js
          node --check store-service-info.js
          node --check store-menu-preview.js
          node --check mukkebi-summer-event.js
      - name: Verify API client and existing static contracts
        run: |
          node scripts/audit-public-repository.mjs
          node cloudflare-data-api-regression-test.mjs
          node scripts/validate-static.mjs
          node scripts/validate-data.mjs
      - name: Verify preserved preview experience
        run: node scripts/run-regression-suite.mjs
      - name: Install mobile browser checker
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify rider recruitment banner in current PR
        run: |
          python3 -m http.server 4173 >/tmp/daedong-rider-banner-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-rider-evergreen-banner.mjs
      - name: Verify home quick filters fit in current PR
        run: |
          python3 -m http.server 4173 >/tmp/daedong-home-filter-fit-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-home-filter-chips.mjs
      - name: Verify exact return from every order app in current PR
        run: |
          python3 -m http.server 4173 >/tmp/daedong-order-return-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-all-order-app-exact-return.mjs
      - name: Verify Yogiyo browser-back return in current PR
        run: |
          python3 -m http.server 4173 >/tmp/daedong-yogiyo-back-return-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-yogiyo-back-return.mjs
      - name: Verify other order methods mobile touch in current PR
        run: |
          python3 -m http.server 4173 >/tmp/daedong-order-method-touch-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-other-order-method-touch.mjs
      - name: Verify Mexican Chicken detail photo recovery in current PR
        run: |
          python3 -m http.server 4173 >/tmp/daedong-detail-photo-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          BASE_URL=http://127.0.0.1:4173 \
          PERF_PROXY_API_ORIGIN=https://daedong-yeosu-data-api-preview.sisakim.workers.dev \
          node scripts/browser-mexican-chicken-detail-photo.mjs
      - name: Verify menu preview close mobile touch in current PR
        run: |
          python3 -m http.server 4173 >/tmp/daedong-menu-close-touch-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-menu-preview-close-touch.mjs
      - name: Verify shared modal close and back mobile touch in current PR
        run: |
          python3 -m http.server 4173 >/tmp/daedong-modal-close-touch-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-modal-close-touch.mjs
      - name: Enforce customer mobile performance budget
        run: |
          node scripts/serve-performance-budget.mjs 4173 >/tmp/daedong-performance-budget-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          BASE_URL=http://127.0.0.1:4173 \
          PERF_PROXY_API_ORIGIN=https://daedong-yeosu-data-api-preview.sisakim.workers.dev \
          node scripts/browser-customer-performance-budget.mjs
      - name: Verify menu search integration in current PR
        run: |
          python3 -m http.server 4173 >/tmp/daedong-menu-search-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          BASE_URL=http://127.0.0.1:4173 \
          PERF_PROXY_API_ORIGIN=https://daedong-yeosu-data-api-preview.sisakim.workers.dev \
          node scripts/browser-alien-pizza-menu-search.mjs
      - name: Preserve PR verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-pr-verification
          path: |
            static-validation-report.json
            data-validation-report.json
            regression-suite-report.json
            browser-alien-pizza-menu-search-report.json
            browser-alien-pizza-menu-search.png
            browser-alien-pizza-menu-search-failure.png
            browser-customer-performance-budget-report.json
            browser-customer-performance-budget.png
            browser-customer-performance-budget-failure.png
            browser-rider-evergreen-banner-report.json
            browser-rider-evergreen-banner.png
            browser-rider-evergreen-popup.png
            browser-rider-evergreen-failure.png
            browser-home-filter-chips-report.json
            browser-home-filter-chips.png
            browser-all-order-app-exact-return-report.json
            browser-order-return-*.png
            browser-yogiyo-back-return-report.json
            browser-yogiyo-back-return.png
            browser-yogiyo-back-return-failure.png
            browser-other-order-method-touch-report.json
            browser-other-order-method-touch-vons.png
            browser-other-order-method-touch-handsu.png
            browser-other-order-method-touch-failure.png
            browser-mexican-chicken-detail-photo-report.json
            browser-mexican-chicken-detail-photo.png
            browser-mexican-chicken-detail-photo-failure.png
            browser-menu-preview-close-touch-report.json
            browser-menu-preview-close-touch.png
            browser-menu-preview-close-touch-failure.png
            browser-modal-close-touch-report.json
            browser-modal-close-touch.png
            browser-modal-close-touch-failure.png
          if-no-files-found: ignore
          retention-days: 14
