name: Verify preview API client

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview-api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check data-api.js
          node --check data-api-runtime.js
          node --check app.js
          node --check final-experience.js
          node --check rc2-fixes.js
          node --check rc3-fixes.js
          node --check rc4-fixes.js
          node --check rc5-fixes.js
          node --check rc6-fixes.js
          node --check rc7-address-map.js
          node --check store-service-info.js
          node --check store-menu-preview.js
          node --check mukkebi-summer-event.js
      - name: Verify API client and existing static contracts
        run: |
          node scripts/audit-public-repository.mjs
          node cloudflare-data-api-regression-test.mjs
          node scripts/validate-static.mjs
          node scripts/validate-data.mjs
      - name: Verify preserved preview experience
        run: node scripts/run-regression-suite.mjs
      - name: Install mobile browser checker
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify rider recruitment banner in current PR
        run: |
          python3 -m http.server 4173 >/tmp/daedong-rider-banner-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-rider-evergreen-banner.mjs
      - name: Verify current deployed preview integration reference
        env:
          BASE_URL: https://preview.daedongmap.com
        run: node scripts/browser-alien-pizza-menu-search.mjs
      - name: Preserve PR verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-pr-verification
          path: |
            static-validation-report.json
            data-validation-report.json
            regression-suite-report.json
            browser-alien-pizza-menu-search-report.json
            browser-alien-pizza-menu-search.png
            browser-alien-pizza-menu-search-failure.png
            browser-rider-evergreen-banner-report.json
            browser-rider-evergreen-banner.png
            browser-rider-evergreen-popup.png
            browser-rider-evergreen-failure.png
          if-no-files-found: ignore
          retention-days: 14
