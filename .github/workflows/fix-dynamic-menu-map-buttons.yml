name: Fix Dynamic Menu Map Buttons

on:
  push:
    branches:
      - fix/dynamic-menu-map-buttons
    paths:
      - .dynamic-menu-map-fix-trigger
      - .github/workflows/fix-dynamic-menu-map-buttons.yml
  pull_request:
    branches:
      - main
    paths:
      - .dynamic-menu-map-fix-trigger
      - .github/workflows/fix-dynamic-menu-map-buttons.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/dynamic-menu-map-buttons
          fetch-depth: 0

      - name: Merge generated menu map with legacy menu stores
        shell: bash
        run: |
          set -euo pipefail
          protected_before="$(sha256sum data/stores.json | awk '{print $1}')"

          python - <<'PY'
          from pathlib import Path

          path = Path('store-menu-preview.js')
          text = path.read_text(encoding='utf-8')

          old_start = "  const MENU_STORES = Object.freeze({\n"
          if text.count(old_start) != 1:
              raise SystemExit('legacy MENU_STORES declaration was not found exactly once')
          text = text.replace(old_start, "  const LEGACY_MENU_STORES = Object.freeze({\n", 1)

          old_end = "  });\n  const menuCache = new Map();\n"
          new_end = """  });
  const MENU_STORES = Object.freeze({
    ...(window.DAEDONG_DDANGYO_MENU_STORES || {}),
    ...LEGACY_MENU_STORES
  });
  const menuCache = new Map();
"""
          if text.count(old_end) != 1:
              raise SystemExit('legacy menu store block ending was not found exactly once')
          text = text.replace(old_end, new_end, 1)

          required = [
              'const LEGACY_MENU_STORES = Object.freeze({',
              '...(window.DAEDONG_DDANGYO_MENU_STORES || {})',
              '...LEGACY_MENU_STORES',
              'for (const storeId of Object.keys(MENU_STORES))',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing required token: {token}')

          path.write_text(text, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_version = 'store-menu-preview.js?v=store-menu-14'
          new_version = 'store-menu-preview.js?v=store-menu-15'
          if index.count(old_version) != 1:
              raise SystemExit('menu preview cache version was not found exactly once')
          index_path.write_text(index.replace(old_version, new_version, 1), encoding='utf-8')
          PY

          node --check store-menu-preview.js

          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = {window: {}};
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('store-menu-content/ddangyo-menu-map.js', 'utf8'), context);
          const generated = context.window.DAEDONG_DDANGYO_MENU_STORES || {};
          if (Object.keys(generated).length !== 444) throw new Error(`expected 444 generated menu stores, got ${Object.keys(generated).length}`);
          const target = generated['2b78b30bde243ae6'];
          if (!target) throw new Error('Barun Bossam menu map entry missing');
          if (target.itemCount !== 40) throw new Error(`Barun Bossam expected 40 menu items, got ${target.itemCount}`);
          const menu = JSON.parse(fs.readFileSync(target.path, 'utf8'));
          if (!Array.isArray(menu.items) || menu.items.length !== 40) throw new Error('Barun Bossam menu file is invalid');
          const preview = fs.readFileSync('store-menu-preview.js', 'utf8');
          if (!preview.includes('window.DAEDONG_DDANGYO_MENU_STORES')) throw new Error('generated menu map is not connected');
          if (!preview.includes('...LEGACY_MENU_STORES')) throw new Error('legacy menu stores are not preserved');
          console.log(JSON.stringify({generatedMenuStores: Object.keys(generated).length, targetStore: '바른보쌈1990 여수웅천점', targetItems: menu.items.length}, null, 2));
          NODE

          protected_after="$(sha256sum data/stores.json | awk '{print $1}')"
          test "$protected_before" = "$protected_after"
          grep -q 'store-menu-preview.js?v=store-menu-15' index.html

      - name: Remove temporary workflow machinery
        shell: bash
        run: |
          rm -f .dynamic-menu-map-fix-trigger
          rm -f .github/workflows/fix-dynamic-menu-map-buttons.yml

      - name: Commit preview-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "daedong-preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git add -A
          git commit -m "Connect all generated Ddangyo menus to food preview buttons"
          git push origin HEAD:fix/dynamic-menu-map-buttons
