name: Enrich New Store Services

on:
  push:
    branches:
      - work/new-store-services-preview
    paths:
      - .new-store-services-trigger
  pull_request:
    branches:
      - main
    paths:
      - ddangyo-preview-runtime.js
      - scripts/probe-naver-mobile-search.py
      - .new-store-services-trigger
      - .github/workflows/enrich-new-store-services.yml

permissions:
  contents: write

concurrency:
  group: enrich-new-store-services-preview-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: work/new-store-services-preview
          fetch-depth: 1

      - name: Probe real mobile Naver search
        run: |
          python -m pip install --disable-pip-version-check selenium
          python scripts/probe-naver-mobile-search.py

      - name: Build CHAK list and verify Naver exact matches
        run: |
          node scripts/prepare-new-store-services.mjs
          node scripts/resolve-new-store-naver.mjs
          node scripts/apply-new-store-services.mjs

      - name: Validate service enrichment
        run: |
          node --check ddangyo-preview-runtime.js
          node - <<'NODE'
          const fs = require('fs');
          const services = JSON.parse(fs.readFileSync('data/ddangyo-new-store-services.json', 'utf8'));
          const enrichment = JSON.parse(fs.readFileSync('data/ddangyo-store-enrichment.json', 'utf8'));
          const newRows = enrichment.stores.filter(row => row.isNew === true);
          if (services.stores.length !== 27) throw new Error(`services ${services.stores.length}`);
          if (newRows.length !== 27) throw new Error(`new rows ${newRows.length}`);
          if (newRows.some(row => row.chakUrl !== 'https://bit.ly/chak-yeosu')) throw new Error('CHAK missing');
          if (newRows.some(row => row.naverMap && row.naverStatus !== 'verified')) throw new Error('unverified Naver map');
          if (newRows.some(row => row.naverMap && !row.naverMap.startsWith('https://map.naver.com/p/entry/place/'))) throw new Error('invalid Naver map URL');
          console.log(JSON.stringify(enrichment.serviceStats, null, 2));
          NODE

      - name: Commit verified services
        run: |
          rm -f .new-store-services-trigger
          rm -f data/.keep-new-store-services
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "신규 27곳 CHAK 및 검증된 네이버지도 preview 보완"
          git pull --rebase origin work/new-store-services-preview
          git push origin HEAD:work/new-store-services-preview
