name: App Scoped Store Benefits

on:
  push:
    branches:
      - work/app-scoped-benefits-preview
    paths:
      - .app-scoped-benefits-trigger
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-app-scoped-benefits.mjs
      - .app-scoped-benefits-trigger
      - .github/workflows/app-scoped-benefits.yml

permissions:
  contents: write

concurrency:
  group: app-scoped-benefits-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: work/app-scoped-benefits-preview
          fetch-depth: 1

      - name: Apply order-app-specific benefit labels
        run: node scripts/apply-app-scoped-benefits.mjs

      - name: Validate data and UI wording
        run: |
          node --check store-service-info.js
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('store-service-info.json', 'utf8'));
          const js = fs.readFileSync('store-service-info.js', 'utf8');
          const css = fs.readFileSync('store-service-info.css', 'utf8');
          const definitions = new Map([
            ...(data.programs || []).map(item => [item.key, item]),
            ...(data.deliveryBenefits || []).map(item => [item.key, item])
          ]);
          const expected = {
            'yeosu-seomseom-pay': '먹깨비·땡겨요',
            'high-oil-support': '땡겨요',
            'onnuri-gift-certificate': '땡겨요',
            'free-delivery': '땡겨요'
          };
          for (const [key, label] of Object.entries(expected)) {
            if (definitions.get(key)?.appLabel !== label) throw new Error(`${key} scope mismatch`);
          }
          for (const info of Object.values(data.stores || {})) {
            for (const item of [...(info.payments || []), ...(info.delivery || [])]) {
              if (!Array.isArray(item.appKeys) || !item.appLabel) throw new Error(`scope missing ${item.key}`);
            }
          }
          for (const text of [
            '먹깨비·땡겨요 섬섬페이',
            '땡겨요 지원금·온누리·무료배달',
            '상품권·쿠폰·무료배달은 표시된 주문앱',
            'scopedBenefitLabel(benefit)',
            '영업시간·주문앱별 혜택'
          ]) if (!js.includes(text)) throw new Error(`UI text missing: ${text}`);
          if (!css.includes('주문앱별 혜택 출처를 고객이 카드와 전체 리스트에서 즉시 구분')) throw new Error('responsive badge CSS missing');
          console.log(JSON.stringify({version:data.version, storeCount:Object.keys(data.stores||{}).length, expected}, null, 2));
          NODE

      - name: Commit app-scoped benefit display
        run: |
          rm -f .app-scoped-benefits-trigger
          rm -f .github/workflows/app-scoped-benefits.yml
          rm -f scripts/apply-app-scoped-benefits.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "상품권·무료배달을 주문앱별로 명확히 표시"
          git pull --rebase origin work/app-scoped-benefits-preview
          git push origin HEAD:work/app-scoped-benefits-preview
