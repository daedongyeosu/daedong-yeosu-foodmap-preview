name: Sync Production Baseline Into Preview

on:
  push:
    branches:
      - work/sync-production-baseline-preview
    paths:
      - .sync-production-baseline-trigger
  pull_request:
    branches:
      - main
    paths:
      - .sync-production-baseline-trigger
      - .github/workflows/sync-production-baseline.yml

permissions:
  contents: write

concurrency:
  group: sync-production-baseline-preview-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: work/sync-production-baseline-preview
          path: preview
          fetch-depth: 1

      - name: Check out production main
        uses: actions/checkout@v4
        with:
          repository: daedongyeosu/daedong-yeosu-foodmap
          ref: main
          path: production
          fetch-depth: 1

      - name: Preserve preview-only additions
        run: |
          mkdir -p /tmp/preview-overlay/data
          cp preview/CNAME /tmp/preview-overlay/CNAME
          cp preview/data/ddangyo-store-enrichment.json /tmp/preview-overlay/data/ddangyo-store-enrichment.json
          cp preview/ddangyo-preview-runtime.js /tmp/preview-overlay/ddangyo-preview-runtime.js
          cp preview/integration-summary.json /tmp/preview-overlay/integration-summary.json
          cp -a preview/store-menu-content /tmp/preview-overlay/store-menu-content

      - name: Replace preview web baseline with production main
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='CNAME' \
            --exclude='android/' \
            --exclude='store-menu-content/' \
            --exclude='data/ddangyo-store-enrichment.json' \
            --exclude='ddangyo-preview-runtime.js' \
            --exclude='integration-summary.json' \
            production/ preview/

          cp /tmp/preview-overlay/CNAME preview/CNAME
          cp /tmp/preview-overlay/data/ddangyo-store-enrichment.json preview/data/ddangyo-store-enrichment.json
          cp /tmp/preview-overlay/ddangyo-preview-runtime.js preview/ddangyo-preview-runtime.js
          cp /tmp/preview-overlay/integration-summary.json preview/integration-summary.json
          rm -rf preview/store-menu-content
          cp -a /tmp/preview-overlay/store-menu-content preview/store-menu-content

      - name: Reattach preview-only runtime to production index
        working-directory: preview
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          let html = fs.readFileSync(path, 'utf8');
          html = html
            .replace(/\n?\s*<script[^>]+store-menu-content\/ddangyo-menu-map\.js[^>]*><\/script>/g, '')
            .replace(/\n?\s*<script[^>]+ddangyo-preview-runtime\.js[^>]*><\/script>/g, '');

          const previewScripts = [
            '  <script src="store-menu-content/ddangyo-menu-map.js?v=20260802-3" defer></script>',
            '  <script src="ddangyo-preview-runtime.js?v=20260802-3" defer></script>'
          ].join('\n');

          const menuScript = /\s*<script[^>]+store-menu-preview\.js[^>]*><\/script>/;
          if (menuScript.test(html)) {
            html = html.replace(menuScript, `\n${previewScripts}$&`);
          } else {
            html = html.replace('</body>', `${previewScripts}\n</body>`);
          }
          fs.writeFileSync(path, html);
          NODE

      - name: Validate identical production baseline and preview overlay
        run: |
          set -e
          for file in app.js final-experience.js styles.css store-menu-preview.js store-menu-preview.css store-service-info.js store-service-info.json data/stores.json; do
            test -f "preview/$file"
            test "$(sha256sum "preview/$file" | cut -d' ' -f1)" = "$(sha256sum "production/$file" | cut -d' ' -f1)"
          done

          grep -q 'preview.daedongmap.com' preview/CNAME
          grep -q 'store-service-info.js' preview/index.html
          grep -q 'ddangyo-menu-map.js?v=20260802-3' preview/index.html
          grep -q 'ddangyo-preview-runtime.js?v=20260802-3' preview/index.html
          grep -q '여수섬섬페이' preview/store-service-info.js
          grep -q '고유가 피해지원금' preview/store-service-info.js
          grep -q '온누리상품권' preview/store-service-info.js
          grep -q '무료배달' preview/store-service-info.js

          node --check preview/app.js
          node --check preview/final-experience.js
          node --check preview/store-menu-preview.js
          node --check preview/store-service-info.js
          node --check preview/ddangyo-preview-runtime.js

          node - <<'NODE'
          const fs = require('fs');
          const enrichment = JSON.parse(fs.readFileSync('preview/data/ddangyo-store-enrichment.json', 'utf8'));
          const summary = JSON.parse(fs.readFileSync('preview/integration-summary.json', 'utf8'));
          if (enrichment.stores.length !== 73) throw new Error(`enrichment stores ${enrichment.stores.length}`);
          if (summary.stores !== 73 || summary.totalMenuItems !== 4270) throw new Error('preview Ddangyo summary changed');
          const newRows = enrichment.stores.filter(row => row.isNew === true);
          if (newRows.length !== 27) throw new Error(`new stores ${newRows.length}`);
          if (newRows.some(row => row.chakUrl !== 'https://bit.ly/chak-yeosu')) throw new Error('CHAK overlay missing');
          if (newRows.filter(row => row.naverStatus === 'verified' && row.naverMap).length !== 14) throw new Error('verified Naver overlay changed');
          const mapText = fs.readFileSync('preview/store-menu-content/ddangyo-menu-map.js', 'utf8');
          if (!mapText.includes('DAEDONG_DDANGYO_MENU_STORES')) throw new Error('Ddangyo menu map missing');
          console.log(JSON.stringify({productionBaseline: true, ddangyoStores: 73, newStores: 27, verifiedNaver: 14}, null, 2));
          NODE

      - name: Commit synchronized preview baseline
        working-directory: preview
        run: |
          rm -f .sync-production-baseline-trigger
          rm -f .github/workflows/sync-production-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "운영본 최신 화면과 기능을 preview 기준으로 동기화"
          git pull --rebase origin work/sync-production-baseline-preview
          git push origin HEAD:work/sync-production-baseline-preview
