name: Audit menu photo coverage

on:
  schedule:
    - cron: '43 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-menu-photo-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify audit safety contract
        run: node menu-photo-coverage-audit-regression-test.mjs
      - name: Audit every published menu
        run: node scripts/audit-menu-photo-coverage.mjs --output "$RUNNER_TEMP/menu-photo-audit" --concurrency 6
      - name: Preserve private review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-photo-coverage-audit
          path: ${{ runner.temp }}/menu-photo-audit/
          if-no-files-found: error
          retention-days: 30
